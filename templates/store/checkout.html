<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">ShopEasy</a>
    <a href="{% url 'cart' %}" class="btn btn-outline-light">Back to Cart</a>
  </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h3 class="fw-bold mb-3">Checkout</h3>
                <hr>

                <div class="d-flex justify-content-between mb-3">
                    <h5>Total Payable:</h5>
                    <h4 class="text-success">₹{{ total }}</h4>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Full Address</label>
                        <textarea name="address" class="form-control" rows="4" required placeholder="House No, Street, City, Pincode..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select class="form-select" disabled>
                            <option>Cash on Delivery (COD)</option>
                        </select>
                        <small class="text-muted">Abhi ke liye sirf COD available hai</small>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-warning btn-lg fw-bold">Place Order</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

</body>
</html>
